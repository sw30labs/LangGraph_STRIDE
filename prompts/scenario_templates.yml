      Industry Malware Trends 1Q25

      Across the FS-ISAC community, the BeaverTail downloader and the InvisibleFerret backdoor were the most reported malwares in 1Q. Both are linked to North Korean threat actors and have been used in a campaign targeting tech industry job seekers. By contrast, regarding threats observed at the ACME Bank perimeter, SocGholish continues to top the list.
      - Drive-by compromise attacks, where malicious content is delivered to unsuspecting users through compromised websites, remain a prevalent vector leveraged by threat actors to infiltrate systems.
      - In contrast to the previous quarter, there is little overlap between the top FS-ISAC reported threats and those observed at the ACME Bank perimeter.

      We expect that opportunistic threat actors will continue to target financial institutions. While the top observed malware families may change, malware loaders associated with initial access brokers, including those operating SocGholish/FakeUpdates campaigns, will very likely remain among the most reported across the sector.

