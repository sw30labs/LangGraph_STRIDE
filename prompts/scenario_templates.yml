      # High Priority TTPs

      In 1Q25, Defense Evasion tactics remained the most significant high-priority TTPs, likely indicating a continued effort by threat actors to operate undetected. Threat hunts focused on all high priority techniques resulted in no observations across ACME Bank environment and no impact to the firm.
      - **Command and Scripting Interpreter: PowerShell (T1059.001)** is a sub-technique that persisted between quarters. It has recently been associated with DarkGate and AsyncRAT, which are both tracked as CIC priority threats.
      - **1Q25** displayed a less diverse set of techniques, falling under four tactics: Defense Evasion, Execution, Collection and Persistence. Several tactics reported on in 4Q24, namely Impact, Command and Control, Initial Access and Lateral Movement, were no longer part of high priority TTPs.

      The high priority TTPs on the list are associated to one or more of the threat actors and malware on CIC's top threats list. Threat actors will continue to innovate and adapt new techniques and procedures to inherently evade detection. The makeup of the top TTP list is likely to shift as Living-Off-the-Land techniques are increasingly used to evade network defense, as evidenced by the consistently high count of Defense Evasion tactics among CIC high priority TTPs.

