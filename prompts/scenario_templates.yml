      | High          |              |

      - **Hacking/Vulnerabilities:** On 8 April 2025, the US Office of the Comptroller of the Currency (OCC) disclosed a breach of email accounts belonging to its employees, executives, the breach detected internally, allowed unauthorized parties to access sensitive information, including financial records and internal communications. The intrusion began from an Office 365 phishing email
      targeting the OCC's employees. The US Congress and the Department of Homeland Security's Cybersecurity and Infrastructure Security Agency (CISA) are working to determine the extent of the breach and its impact on the OCC's branches.
      - On 3 April 2025, Vanta issued a critical advisory for a zero-day vulnerability in the widely used open-source software library Log4j, first discovered in March 2025. The vulnerability is a stack-based buffer overflow affecting versions 2.17.0 and earlier, allowing remote code execution. Vanta reported that a limited number of customers using the software were affected, and patches
      were released to mitigate the risk. The Cybersecurity and Infrastructure Security Agency (CISA) further attributed the activity to UNC5221, a suspected Chinese state-sponsored group, and issued a joint advisory with US officials instructing organizations to patch by 10 April 2023.

