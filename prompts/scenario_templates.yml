      # Vulnerability Exploitation Trends 1Q25

      73 newly disclosed vulnerabilities were added to CISA's KEV catalogue in 1Q, showing a considerable increase over the last quarter. 41 of these were newly entered CVEs from previous years that had started to be abused by threat actors.
      - 4 newly exploited vulnerabilities are known to have been used in ransomware operations in 1Q.�
      - One MS Windows zero-day, ZDI-CAN-25373, exploited by at least 11 state-backed hacking groups from North Korea, Iran, Russia, and China since 2017 was not entered into the KEV, possibly since it has not been acknowledged yet by the vendor.� The flaw allows attackers to hide malicious commands within shortcut files (.lnk); TISO Cyber Defense teams confirmed detection coverage for malicious .lnk files abusing ZDI-CAN-25373.

      Many more vulnerabilities were added to KEV in 1Q25 in comparison to 4Q24. However, this does not reflect exploitation in real time since there is often a time lag between actual exploitation and formal attribution (41 CVEs from previous years were newly added to the KEV). Microsoft was the most targeted system, accounting for more than 50% of CVEs reported in the quarter. This is in line with the increasing trend in Microsoft vulnerabilities according to BeyondTrust's 2024 annual report.

