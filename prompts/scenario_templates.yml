      # 
      ![ACME Bank Logo](https://www.ACME Bank.com)

      # **Internal** # Quarterly Threat Trends Report **Cyber Intelligence Center** 1Q 2025
      # Vulnerabilities and Zero-Day Trends 1Q25

      ## Threat insights

      Of the vulnerabilities added to KEV in 1Q25, over 42% were classed as zero-days, and all but one were under active exploitation. In 4Q24, the percentage was 35%. It is important to note, however, that this metric does not account for the time for secondary actors to adopt zero-day vulnerabilities for exploitation after disclosure.
      - 31 were classed as zero-days, already actively exploited
      - 12 of the zero-days impacted Microsoft products.

      China-based espionage threat actors were observed actively exploiting vulnerabilities in Ivanti products. The vulnerabilities, CVE-2025-0282 and CVE-2025-0283, both stack-based buffer overflow bugs, allow a remote unauthenticated attacker to achieve remote code execution or a local authenticated attacker to escalate their privileges.

      ## Threat outlook

      While we are likely to continue to see periodic examples of ransomware actors pioneering zero-day vulnerabilities, it is likely that the majority will focus on exploiting recently disclosed vulnerabilities. This is due in part to the fact that even well-known critical vulnerabilities remain unpatched for extended periods of time, presenting easy targets for these groups.
      Of the 31 zero-day vulnerabilities in 1Q, Microsoft included six zero-day vulnerabilities in their March Patch Tuesday patch that attackers were actively exploiting in the wild. Most of these zero-day vulnerabilities involved file-system drivers that require local access to exploit. Consequently, they are more difficult to exploit, resulting in criticality levels being classified as HIGH rather than CRITICAL (the two highest vulnerabilities had CVSS scores of 9/10).

      ## Exploitation by Quarter

      | Quarter | N-Days 0 Days | N-Days D+1 - D+7 |
      |---------|---------------|--------------------|
      | Q1-2024 | 20            | 30                 |
      | Q2-2024 | 30            | 40                 |
      | Q3-2024 | 30            | 40                 |
      | Q4-2024 | 40            | 50                 |
      | Q1-2025 | 70            | 80                 |

      Data taken primarily from US CISA's Known Exploited Vulnerabilities (KEV) database. These represent the number of vulnerabilities added to the database each quarter. These do not exclusively represent newly disclosed vulnerabilities and include previously known vulnerabilities that are newly exploited.
      The total increase in the chart above against the numbers for Q4 2024 is explained in that in Q1 2025 every new KEV vulnerability was categorized as zero-day or not, which was not always the case in the past.

      # General DDoS Trends 1Q25

      ## Threat insights

      Over Q1 Akamai, ACME Bank DDoS mitigation provider, observed a total of 778 DDoS events against 156 data centers belonging to 98 financial services customers.
      Akamai observations on attacks against this sector of their customer base include:
      - The most frequent attack vector was DNS flood (29%, 222).
      - The largest attack in Q1 measured in bandwidth peaked at 450.71 Gbps and involved a combination of DNS reflection, RESET flood, SYN flood and UDP fragmentation traffic.
      - The largest attack peaked at 46.46 Mpps and leveraged DNS reflection, SYN ACK floods, SYN floods, TCP anomalies and UDP fragments.

      
      ![DDoS attack vectors observed in Q1 2025](image_link)


      ## Threat outlook

      There was a minor decrease in the frequency and intensity of attacks compared to 4Q24 that could be seasonal in nature. DDoS continues to be an easily accessible attack vector for financially-motivated, ideologically motivated, and state aligned threat groups. As such, the attack vector is in line with findings from Europol�s latest Serious and Organised Crime Threat Assessment, which describes how criminal networks are increasingly connected with hybrid threats, particularly from Russia. This connection is leading to a rise in politically motivated cyberattacks and sabotage of critical infrastructure within the EU. DDoS attacks, primarily used for disruption and extortion, may become more prevalent as a tactical tool used by these hybrid threats, thereby increasing the risk of DDoS attacks on critical infrastructure during periods of geopolitical instability.

      # Financial Sector DDoS Trends 1Q25

      ## Threat insights

      - FS-ISAC member-reported DDoS attacks decreased slightly in 1Q25 compared to 4Q24. However, 1Q25 attacks were significantly higher than the same period in 2024. In 1Q24, FS-ISAC reported a total of 30 attacks while in 1Q25, a total of 91 attacks were reported.
      - Geopolitical conflicts continued to be a key driver of DDoS activity in 1Q, consistent with trends observed in previous quarters.
      - On 5 & 13 January, several Swiss financial institutions, including ACME Bank, experienced DDoS probes or attacks by the threat actor �RootDoS�, a pro-Palestine hacktivist group, apparently in retaliation for the official ban on face coverings that came into effect in Switzerland on January 1. Similarly, on 20 January, several Swiss institutions, mainly across tourism and rail services, faced DDoS attacks from pro-Russian hacktivist group NoName057(16). The threat actor threatened to target entities in Switzerland in response to Switzerland and the UK pledging $500,000 for a humanitarian demining project in Ukraine.

      ## Threat outlook

      FS-ISAC member-reported DDoS attacks decreased from 4Q24 to 1Q25, from a total of 109 to 91 attacks. This is in line with the wider DDoS trend observed in 1Q25. The data is also consistent with internal ACME Bank data, with January seeing the highest number of attacks for the quarter. However, the slight decrease for the quarter is not an indication of long term trends as DDoS attacks are expected to continue to increase in frequency and intensity, continuously breaking records for their scale and volume observed. CIC expects global events will continue to contribute to increasing DDoS activity, which will affect financial institutions. Significant impact to ACME Bank remains unlikely.

