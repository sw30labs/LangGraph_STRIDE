      # 1Q25 Key Takeaways

      ## CIC Priority Threats
      - While the list of Priority Threats was previously dominated by Ransomware threat actors, Initial Access Brokers (IABs) now make up the majority, followed by Ransomware, Espionage and Crypto Theft. Most priority threat actors continue to be at least partially financially motivated.
      - As geopolitical tensions increase globally, non-financially motivated threat actors, including those focused on espionage or disruption, may become more prominent threats.

      ## Malware
      - Loaders and Trojans associated with SocGholish/FakeUpdates continue to be persistently observed by ACME Bank.
      - 1Q25 saw the first reported sighting of the new LockBit 4.0 ransomware, while CIOP continued its Cleo MFT campaign.

      ## Vulnerabilities
      - 73 newly disclosed vulnerabilities were added to CISA's Known Exploited Vulnerabilities (KEV) catalogue in 1Q, an increase over 4Q24, but 43 were CVEs added from previous years. One MS Windows zero-day, ZDI-CAN-25373, was not added to KEV since it has not been acknowledged yet by the vendor, despite active exploitation.
      - 42% (31) of CISA's KEV vulnerabilities were classed as zero-days, 12 of which impact Microsoft products.

      ## DDOS
      - ACME Bank and other Swiss financial peers were targeted as part of Swiss campaigns. ACME Bank observed several probes which were all successfully blocked and had no impact.
      - Geopolitical conflicts continued to be a key driver of DDoS activity in 1Q.

      ## Phishing
      - March saw the highest volume of phishing attempts across all regions. Phishing lures were mostly business-related.
      - The increasing accessibility of Artificial Intelligence (AI) and phishing kits is likely to continue to drive up phishing campaigns in 2Q.

      # 1Q25 Highlights

      The overall threat outlook remained stable for the first quarter of 2025. In January, Cloudflare reported the largest DDoS attack on record peaking at 5.6 TBPS and lasting 80 seconds, while pro-Russian hacktivist group NoName057(16) launched DDoS attacks targeting several Swiss institutions during the World Economic Forum (WEF). In February, nation state actors linked to North Korea stole USD 1.46 billion worth of Ethereum from Bybit, the largest ever theft from a crypto platform, in March a threat actor claimed to have compromised Oracle cloud infrastructure. The US Director of National Intelligence and French Cybersecurity Agency ANSSI both published annual reports for 2024 highlighting a rise of geopolitics in driving cybercrime and growing cooperation among adversaries. ANSSI also mentioned the increase in the targeting of cloud environments. Cooperation between groups was also highlighted in the Europol EU Serious and Organised Crime Threat Assessment in the EU. Europol predicted that ransomware, data theft and extortion will become the most disruptive forms of crime globally.

