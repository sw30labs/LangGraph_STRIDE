      # CIC Priority Threat Actors

      From 1Q25 onwards, CIC priority threat actor reporting includes 15 threat actors, up from 10 previously. This change is represented in the graph to the right.

      - Compared with previous quarters, there is a greater diversity among priority threat actor categories. While the list was previously dominated by Ransomware threat actors, Initial Access Brokers (IABs) now make up the majority of priority threat actors, followed by Ransomware, Espionage and Crypto Theft.
      - Nevertheless, with the exception of two Espionage threat actors, the vast majority of priority threat actors are at least partially financially motivated.
      - The two Espionage threat actors are reportedly Russian state-sponsored groups RomCom and APT29. RomCom has previously targeted the Financial Services sector and is a versatile and capable threat actor, as the group has been observed exploiting multiple zero-day vulnerabilities and employing techniques from all 14 MITRE Tactics. APT29 is a sophisticated threat actor known for
        targeting Microsoft environments.
      - North Korea-linked UNC5342, one of two Crypto Theft threat actors, has been observed posing as recruiters looking to fill lucrative positions at IT companies and using BeaverTail malware in phishing campaigns targeting job seekers in the technology industry.

      Ransomware actors and IABs, which are also part of the ransomware ecosystem, are likely to continue to make up the majority of CIC's priority threats, with phishing continuing to be an effective access vector. However, as geopolitical tensions increase globally, non-financially motivated threat actors, including those focused on espionage or disruption, may become more prominent
      threats.

