      CIC Priority Malware 1Q25

      **Threat insights**

      From 1Q25 onwards, priority malware reporting differentiates between top ransomware variants and other forms of malware. This change in reporting is the reason why the below graph includes five rather than ten malware families. As a result, a like-for-like comparison with previous quarters is challenging.

      - Regarding ransomware variants, 1Q25 saw the first reported sighting of the new LockBit 4.0 ransomware announced in December 2024. According to researchers, the new version enhanced its techniques related to stealth and adaptability. However, its operators continued to struggle to recover from recent law enforcement action, including the recent extradition of an alleged LockBit
        developer to the US.
      - Meanwhile, Cl0p continued to release names and details of victims, further cementing their campaign against organizations that utilized vulnerable Cleo MFT solutions.
      - Among the remaining malwares, most are categorized as Loaders or Info Stealers.� Of note is AsyncRAT, which has been observed as part of recent ClickFix campaigns. ClickFix, a social engineering technique deceiving users into executing malicious commands through fake error messages, was first observed in October 2023 and saw significant adoption in late 2024.

      **Threat outlook**

      While certain types of malware may fluctuate in popularity or diminish following law enforcement operations, the fundamental demand for infostealers, loaders, and trojans is expected to remain constant. The composition of the most prevalent malware list is unlikely to undergo significant changes due to the integral role these malware play in the broader cybercrime ecosystem and their
      continued utilization by cybercriminal actors.

      �Loaders are designed to achieve an initial infection and then download additional malware payloads, while an Info Stealer is malware designed to gather information from a system.

