      # Cyber Threat Landscape Dashboard April 2025
      ## Cyber Threat Landscape Summary:
      The month of April saw multiple notable incidents and developments across the threat landscape, including a breach at the US Office of the Comptroller of the Currency (OCC), state-sponsored threat actors being observed utilizing the "ClickKit" social engineering technique in espionage campaigns, and the US and China

      - On 21 April 2025, Dutch payment firm Adyen faced a coordinated DDoS attack that temporarily disrupted payment services for many customers across Europe. The attack involved three waves generating millions of requests per minute from botnets targeting Adyen's payment services including commerce and In-Person Payment Transaction processing. No threat actors have been identified or
      claimed responsibility.

