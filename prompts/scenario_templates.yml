      - **On 24 January**, CIC received information from a peer financial institution that identified several personas overlapping with previously reported Democratic People�s Republic of Korea (DPRK) fake IT workers Modus Operandi and DPRK monitoring activities, on 24 March TISO Cyber Defense identified an individual suspected to be associated with DPRK who applied for an open position at ACME Bank, unsuccessfully. As previously reported, the DPRK workers primarily seek to gain employment to raise funds for the North Korean regime, but there are reported cases where these individuals have deployed malware or exfiltrated sensitive information and demanded a ransom to not publish the data. In the ACME Bank case, the threat actor created a ACME Bank persona and applied for six ACME Bank roles. Only one of the applications was processed, passing initial hiring and technical screening. The malicious candidate was observed after this stage. The peer institution reported having detected job applications from these personas, likely in an attempt to infiltrate the company.

