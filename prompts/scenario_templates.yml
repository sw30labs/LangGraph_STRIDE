      # Phishing Trends 1Q25

      - The phishing volume observed across ACME Bank increased in March across all regions, compared to January and February. The spike in emails for AMER and CH may have been due to tax season in both countries. AMER saw the highest number of phishing attempts across all regions.
      - 76% of campaigns leveraged business and work-related themes. This is a recurring lure which is usually leveraged by threat actors to redirect users to credential harvesting pages, or for financial fraud attempts where the victim is requested to key in their credit card details.
      - On March 3, KnowBe4 Threat Labs identified a large-scale phishing campaign originating from legitimate Microsoft domains. The attack peaked on March 3, with 7,000 phishing emails from sent in 30 minutes. While it is unclear if artificial intelligence (AI) was used in this phishing campaign, KnowBe4�s annual [Phishing Trends Report](https://www.knowbe4.com/phishing-trends-report)
        indicates that advances in AI are leading to phishing attacks that are more prolific and convincing to end users.
      - The ClickFix social engineering tactic has gained significant traction and widespread adoption among threat actors due to its effectiveness. ClickFix operates by deceiving users into taking an action to �fix� a non-existent issue by either automatically or manually copying and pasting a malicious command into their terminal or Run dialog.

      Phishing campaigns are likely to increase in 2Q25 due to the availability of new phishing kits coupled with greater accessibility of AI tools. These campaigns are also likely to be more effective. On the other hand, continued finetuning and updating of the firm�s phishing detection controls is likely to lead to a significant reduction in the volume of phishing emails successfully
      reaching employees inboxes.

