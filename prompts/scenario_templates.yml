      ## Notable Developments
      
      | Nation-State Threats | Silk Typhoon Targeting Cloud Apps | Ransomware Targeting AWS & Containerized Environments | Misconfigurations & Supply Chain Weaknesses | Data Exfiltration & Lateral Movement in the Cloud |
      |----------------------|-----------------------------------|----------------------------------------------------------|------------------------------------------------|----------------------------------------------------------------|
      Silk Typhoon, a Chinese APT group, has shifted focus toward compromising cloud-hosted applications and identity systems like Azure AD. They often leverage stolen credentials and legitimate cloud tools to persist and move laterally within environments. These campaigns are highly stealthy, often remaining undetected while exfiltrating sensitive data over long periods. | Modern
      ransomware groups are increasingly targeting cloud services, encrypting data within AWS ECS containers, S3 buckets, and EBS volumes. They typically gain access via compromised API keys or misconfigured IAM roles. Some operations now deploy ransomware across Kubernetes clusters, disrupting services and increasing ransom pressure. | A major source of cloud compromise remains human error,
      especially misconfigured storage buckets and excessive permissions. Attackers exploit these weak points using automated scanning tools. Additionally, vulnerable CI/CD pipelines and container images expose environments to both direct exploitation and supply chain attacks. | Once inside, attackers use legitimate APIs and cloud-native tools to steal data and move across services undetected.
      Techniques include abusing AWS CLI or SDKs, altering logs, and creating hidden backdoors in serverless functions or IAM roles. This makes containment and incident response in cloud environments especially challenging. |

      *ACME Bank*

      
      # Notable Events by Region 1Q25

      ## Americas
      - On 23 January, the FBI warned that fake North Korean IT workers were stealing source code and extorting U.S. companies that had been tricked into hiring them. Two North Korean nationals and three facilitators who ran US-based "laptop farms" were indicted for fraud involving remote technology worker schemes that generated revenue for the DPRK to bypass sanctions.
      - On 28 February, US Defence Secretary Pete Hegseth reportedly ordered US Cyber Command to stand down from all offensive cyber operations against Russia, amid negotiations on the war in Ukraine.
      - On 5 March, the U.S. Department of Justice indicted 12 Chinese nationals, accusing them of being involved in cyberattacks against U.S. and Asian government agencies, and dissidents of the People's Republic of China (PRC).

      ## Europe
      - On 30 January 2025, Europol and international law enforcement agencies announced the forced closure of two of the world's largest cybercrime forums, Cracked and Nulled, which together had approximately 10 million users.
      - On Tuesday 4 February, the Everest ransomware group claimed on its data leak site that ITS Global's internal network had been compromised. ITS Global is a specialist in banking software and integrations and is leveraged by many financial institutions.

      ## Switzerland
      - On 5 January, several Swiss financial institutions, including ACME Bank, experienced DDoS probes or attacks. The attacks varied in nature, lasted for a few minutes, and caused minor impact in some cases. One of these has been publicly claimed by the threat actor "RooDOS", a pro-Palestine hacktivist group, on its Telegram channel apparently in retaliation for the official ban on face
        coverings which came into effect in Switzerland on January 1.
      - On 20 January, several Swiss institutions, mainly across tourism and rail services, faced DDoS attacks from pro-Swiss groups.

      ## Middle East & Africa
      - On 25 February, the UAE Cyber Security Council and IT managed service provider CPX published a report indicating the UAE's financial sector is increasingly targeted by threat actors. Some 21% of cybersecurity incidents in the region targeted banks and financial services, making it the second-most targeted after government systems (35%).

      ## Asia Pacific
      - On 22 January, Cloudflare reported it had blocked a 5.6 terabit per second (Tbps) UDP DDoS attack in the last quarter of 2024. The attack was launched by a Mirai-variant botnet against an internet service provider in Eastern Asia and lasted 80 seconds.
      - On 28 January, DeepSeech, a Chinese AI startup, announced that it was forced to limit sACME Bankcriptions to its online services after experiencing large-scale malicious attacks on its services. It remains unclear if this attack was malicious or simply overload due to demand.
      - OpenAI removed numerous accounts linked to users from China and North Korea, believed to be exploiting its technology for malicious activities including surveillance and opinion-influencing operations.

      Glossary of Terms
      - **AitM - Adversary-in-the-Middle**
        AitM a form of data eavesdropping and theft where an attacker intercepts data from a sender to the recipient, and then from the recipient back to the sender. It�s called �adversary in the middle� because the attacker�s device sits between the sender and recipient and relays messages silently without making either party aware of the eavesdropping

      Glossary of Terms

      - **APT - Advanced persistent threat**
      An advanced persistent threat is a stealthy threat actor, typically a nation state or state-sponsored group, which gains unauthorized access to a computer network and remains undetected for an extended period. In recent times, the term may also refer to non-state-sponsored groups conducting large-scale targeted intrusions for specific goals.

      - **Bits per second (bps)**
      The volume of a DDoS attack is measured in bits per second. Higher volume attacks are often measured in gigabits per second (Gbps) or terabits per second (Tbps), which are equal to one million bits per second and one trillion bits per second, respectively.

      - **DDoS - Distributed denial-of-service**
      A distributed denial-of-service (DDoS) attack is an attempt to make an online service unavailable by overwhelming it with traffic from multiple sources. They target a wide variety of important resources, from banks to news websites, and present a major challenge to making sure people can publish and access important information.

      - **Deepfake**
      A deepfake is an artificial image or video (a series of images) generated by a special kind of machine learning called �deep� learning (hence the name). There are two levels of deepfakes work in this article: one for the layperson, and one for the technically inclined.

      - **DNS Flood Attack**
      DNS flood is a type of Distributed Denial of Service (DDoS) attack in which the attacker targets one or more Domain Name System (DNS) servers belonging to a given zone, attempting to hamper resolution of resource records of that zone and its sub-zones.

      - **IAB - Initial Access Broker**
      An IAB is a threat actor specializing in infiltrating computer systems and networks, then selling that unauthorized access to other malicious bad actors.

      - **Infostealer**
      An information stealer (or info stealer) is a Trojan that is designed to gather information from a system. The most common form of info stealer gathers login information, like usernames and passwords, which it sends to another system either via email or over a network. Other common information stealers, such as keyloggers, are designed to log user keystrokes which may reveal sensitive information.

