[project]
name = "langgraph-stride"
version = "0.1.0"
description = "Dual-platform STRIDE and DREAD threat modeling for DGX Spark and Apple Silicon"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicolas Cravino" }]
dependencies = [
    "httpx>=0.27",
    "langgraph>=0.4",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
langgraph-stride = "src.cli:app"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["web/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/mock_inference_server.py" = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
