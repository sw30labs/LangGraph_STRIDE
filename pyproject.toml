[project]
name = "langgraph-stride"
version = "0.1.0"
description = "Dual-platform STRIDE and DREAD threat modeling for DGX Spark and Apple Silicon"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicolas Cravino" }]
dependencies = [
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "neo4j==6.2.0",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "typer==0.27.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.2"]
graph = ["neo4j==6.2.0"]

[project.scripts]
langgraph-stride = "src.cli:app"

[tool.setuptools]
packages = ["src", "src.intel", "src.maintain"]

[tool.setuptools.package-data]
src = ["data/*", "prompts/*", "web/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/mock_inference_server.py" = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
